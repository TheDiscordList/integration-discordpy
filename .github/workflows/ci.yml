name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.library }} on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One library per job: discord.py and Pycord both install the `discord`
        # package, so they can never share an environment.
        library: [discordpy, pycord, nextcord, disnake]
        # 3.10 is not decoration: it is the only thing that turns
        # requires-python from a claim into a fact.
        python: ["3.10", "3.14"]
        exclude:
          # nextcord 3 needs 3.12+. On 3.10 the extra resolves to nextcord 2.6,
          # which cannot even import without setuptools<81.
          - { library: nextcord, python: "3.10" }
        include:
          - { library: discordpy, python: "3.11" }
          - { library: discordpy, python: "3.12" }
          - { library: discordpy, python: "3.13" }
          - { library: nextcord, python: "3.12" }
          # No Discord library at all: the core and the webhooks need none.
          - { library: core, python: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --group dev ${{ matrix.library != 'core' && format('--extra {0}', matrix.library) || '' }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "thediscordlist"
dynamic = ["version"]
description = "Publish your discord.py bot's stats, heartbeat and commands to TheDiscordList, and verify its webhooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "TheDiscordList" }]
keywords = ["discord", "discord.py", "thediscordlist", "bot-list", "autopost", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet",
    "Typing :: Typed",
]
dependencies = ["discord.py>=2.4,<3", "aiohttp>=3.9,<4"]

[project.urls]
Homepage = "https://github.com/TheDiscordList/integration-discordpy"
Documentation = "https://thediscordlist.com/docs/api"
Issues = "https://github.com/TheDiscordList/integration-discordpy/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.12", "mypy>=1.15"]

[tool.hatch.version]
path = "src/thediscordlist/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/thediscordlist"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "PT", "TID"]
# S311: `random` is used for scheduling jitter, never for anything security-facing.
# BLE001-adjacent broad excepts are deliberate: nothing here may crash a host bot.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
# discord.py is duck-typed throughout (`Client`, `AutoShardedClient`, `Bot` and
# mocks all satisfy the same reads), so the client is deliberately `Any`.
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # discord.py's own deprecations are not ours to fix, and a new one lands with
    # every CPython release (stdlib audioop, asyncio.iscoroutinefunction, ...).
    "ignore::DeprecationWarning:discord.*",
]
